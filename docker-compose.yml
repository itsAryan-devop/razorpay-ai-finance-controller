# Single-service compose for the demo. The reconciliation engine uses SQLite, so no
# database service is required to run. The commented `db` block shows the one change
# needed to graduate to Postgres (swap SqliteSource -> a PostgresSource DSN); it is
# intentionally not wired, to avoid shipping half-built infra (see ARCHITECTURE.md).
services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=heuristic     # keyless, no network — the zero-config default
      # To use a FREE local Ollama running on the HOST (Docker Desktop resolves
      # host.docker.internal automatically on Windows/Mac):
      # - LLM_PROVIDER=ollama
      # - OLLAMA_HOST=http://host.docker.internal:11434
      # - OLLAMA_MODEL=qwen3:4b
      # Or the paid API:
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # On Linux hosts only, uncomment to make host.docker.internal resolve:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - recon-data:/app/data/generated              # persist audit log + DB across runs

  # db:                                             # ← next step for real scale
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: recon
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  recon-data:
  # pg-data:
