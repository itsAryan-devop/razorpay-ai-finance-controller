name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate data
        run: python src/generate_data.py
      - name: Verify ground-truth invariants
        run: python src/selftest_data.py
      - name: Run matcher (baseline metrics)
        run: python src/matcher.py
      - name: Test suite
        run: pytest -q
