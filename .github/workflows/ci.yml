name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate data
        run: python src/generate_data.py
      - name: Verify ground-truth invariants
        run: python src/selftest_data.py
      - name: Run matcher (baseline metrics)
        run: python src/matcher.py
      - name: Run pipeline (handler on escalated residue, keyless heuristic)
        run: python src/pipeline.py
      - name: Re-run pipeline (idempotency: second execute applies nothing)
        run: python src/pipeline.py --execute && python src/pipeline.py --execute
      - name: Test suite
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs generate + selftest inside the build)
        run: docker build -t recon-controller .
